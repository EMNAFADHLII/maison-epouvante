name: CD to GCP VM

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-vm:
    name: Deploy backend on VM via SSH
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy on VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          port: ${{ secrets.GCP_VM_SSH_PORT || '22' }}
          script: |
            set -e
            APP_DIR="${{ secrets.GCP_VM_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/maison-epouvante"
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Repository not found in $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"
            git fetch --all
            git checkout main
            git pull --ff-only origin main

            cd backend
            docker build -f dockerfile -t maison-epouvante-backend:latest .

            docker rm -f maison-epouvante-backend || true

            docker run -d \
              --name maison-epouvante-backend \
              --restart unless-stopped \
              --env-file .env \
              -p 3000:3000 \
              maison-epouvante-backend:latest
