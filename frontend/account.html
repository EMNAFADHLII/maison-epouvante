<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maison Epouvante - Mon compte</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="bg-dark text-light">
  <nav class="navbar navbar-dark bg-black border-bottom border-danger">
    <div class="container">
      <a class="navbar-brand text-danger" href="index.html">Maison Epouvante</a>
      <button class="btn btn-outline-light btn-sm" onclick="logout()">Deconnexion</button>
    </div>
  </nav>

  <main class="container py-5">
    <div class="card bg-black border-danger text-light">
      <div class="card-body">
        <h1 class="h3 text-danger">Mon compte</h1>
        <p class="text-secondary mb-4">Espace utilisateur simplifie.</p>
        <ul class="list-group list-group-flush">
          <li class="list-group-item bg-black text-light border-secondary">
            Etat de connexion:
            <strong id="authState"></strong>
          </li>
          <li class="list-group-item bg-black text-light border-secondary">
            Token present:
            <strong id="tokenState"></strong>
          </li>
        </ul>
      </div>
    </div>
  </main>

  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script>
    const token = localStorage.getItem("token");
    document.getElementById("authState").textContent = token ? "Connecte" : "Non connecte";
    document.getElementById("tokenState").textContent = token ? "Oui" : "Non";
  </script>
</body>
</html>
