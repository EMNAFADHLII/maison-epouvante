<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Ajouter une annonce – Maison Épouvante</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- CSS optionnel -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="bg-dark text-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-black shadow">
  <div class="container">
    <a class="navbar-brand fw-bold text-danger" href="index.html">
      🏚️ Maison Épouvante
    </a>
    <button class="btn btn-outline-light" onclick="logout()">Déconnexion</button>
  </div>
</nav>

<!-- CONTAINER -->
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-8">

      <div class="card bg-secondary text-light shadow-lg">
        <div class="card-body">
          <h3 class="mb-4 text-center">➕ Ajouter une maison hantée</h3>

          <form id="listingForm">

            <!-- TITRE -->
            <div class="mb-3">
              <label class="form-label">Titre de l’annonce</label>
              <input type="text" class="form-control" placeholder="Ex : La Maison aux Murmures" required />
            </div>

            <!-- DESCRIPTION -->
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" rows="4"
                placeholder="Racontez l’histoire de cette maison, ce qui la rend inquiétante..."
                required></textarea>
            </div>

            <!-- LIEU -->
            <div class="mb-3">
              <label class="form-label">Lieu</label>
              <input type="text" class="form-control" placeholder="Ex : Forêt de Brocéliande" required />
            </div>

            <!-- PRIX -->
            <div class="mb-3">
              <label class="form-label">Prix par nuit (€)</label>
              <input type="number" class="form-control" placeholder="Ex : 120" required />
            </div>

            <!-- CATEGORIE -->
            <div class="mb-3">
              <label class="form-label">Catégorie</label>
              <select class="form-select" required>
                <option value="">-- Choisir une catégorie --</option>
                <option>Hantée</option>
                <option>Abandonnée</option>
                <option>Maudite</option>
                <option>Mystérieuse</option>
              </select>
            </div>

            <!-- IMAGE -->
            <div class="mb-4">
              <label class="form-label">Image (URL)</label>
              <input type="url" class="form-control"
                placeholder="https://images.unsplash.com/..." />
              <div class="form-text text-light">
                Utilise une image sombre / inquiétante (Unsplash recommandé)
              </div>
            </div>

            <!-- BOUTON -->
            <button class="btn btn-danger w-100">
              Publier l’annonce
            </button>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>

<script>
  // Protection : accès uniquement si connecté
  if (!localStorage.getItem("token")) {
    window.location.href = "login.html";
  }

  const form = document.getElementById("listingForm");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const inputs = form.querySelectorAll("input, textarea, select");

    const listing = {
      title: inputs[0].value,
      description: inputs[1].value,
      location: inputs[2].value,
      price: Number(inputs[3].value),
      category: inputs[4].value,
      imageUrl: inputs[5].value || null
    };

    try {
      const res = await fetch("http://localhost:3000/api/listings", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + localStorage.getItem("token"),
        },
        body: JSON.stringify(listing),
      });

      const data = await res.json();

      if (!res.ok) {
        alert(data.message || "Erreur lors de la création");
        return;
      }

      alert("Annonce publiée avec succès 👻");
      window.location.href = "index.html";
    } catch (err) {
      alert("Erreur serveur");
      console.error(err);
    }
  });
</script>

</body>
</html>
