<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maison Epouvante - Creer une annonce</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="bg-dark text-light">
  <nav class="navbar navbar-dark bg-black border-bottom border-danger">
    <div class="container">
      <a class="navbar-brand text-danger" href="index.html">Maison Epouvante</a>
      <button class="btn btn-outline-light btn-sm" onclick="logout()">Deconnexion</button>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card bg-black border-danger">
          <div class="card-body">
            <h1 class="h4 text-danger mb-4">Ajouter une annonce</h1>
            <form id="listingForm" class="row g-3">
              <div class="col-12">
                <label class="form-label">Titre</label>
                <input type="text" class="form-control" required>
              </div>
              <div class="col-12">
                <label class="form-label">Description</label>
                <textarea class="form-control" rows="4" required></textarea>
              </div>
              <div class="col-md-6">
                <label class="form-label">Lieu</label>
                <input type="text" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Prix</label>
                <input type="number" min="0" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Categorie</label>
                <select class="form-select" required>
                  <option value="">Choisir...</option>
                  <option value="Hantee">Hantee</option>
                  <option value="Abandonnee">Abandonnee</option>
                  <option value="Maudite">Maudite</option>
                  <option value="Mysterieuse">Mysterieuse</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Image URL</label>
                <input type="url" class="form-control" placeholder="https://...">
              </div>
              <div class="col-12">
                <button class="btn btn-danger w-100" type="submit">Publier</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script>
    if (!localStorage.getItem("token")) {
      window.location.href = "login.html";
    }

    const form = document.getElementById("listingForm");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const inputs = form.querySelectorAll("input, textarea, select");
      const listing = {
        title: inputs[0].value.trim(),
        description: inputs[1].value.trim(),
        location: inputs[2].value.trim(),
        price: Number(inputs[3].value),
        category: inputs[4].value,
        imageUrl: inputs[5].value.trim(),
      };

      try {
        await apiFetch("/listings", {
          method: "POST",
          body: JSON.stringify(listing),
        });

        alert("Annonce publiee avec succes.");
        window.location.href = "index.html";
      } catch (err) {
        alert(err.message || "Erreur lors de la creation");
      }
    });
  </script>
</body>
</html>
