<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maison Epouvante - Annonces</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="bg-dark text-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-danger">
    <div class="container">
      <a class="navbar-brand fw-bold text-danger" href="index.html">Maison Epouvante</a>
      <div class="d-flex gap-2">
        <a href="account.html" class="btn btn-outline-danger btn-sm">Mon compte</a>
        <a href="login.html" class="btn btn-outline-light btn-sm">Connexion</a>
        <a href="create-listing.html" class="btn btn-danger btn-sm">Ajouter une annonce</a>
      </div>
    </div>
  </nav>

  <section class="py-4 border-bottom border-danger-subtle">
    <div class="container">
      <h1 class="text-danger mb-3">Annonces de maisons</h1>
      <p class="mb-0">Decouvrez les maisons hantees, abandonnees et maudites.</p>
    </div>
  </section>

  <section class="container my-4">
    <div class="row g-3">
      <div class="col-md-5">
        <input
          id="search"
          type="text"
          class="form-control bg-black text-light border-danger"
          placeholder="Rechercher une annonce..."
        >
      </div>
      <div class="col-md-4">
        <select id="categoryFilter" class="form-select bg-black text-light border-danger">
          <option value="">Toutes les categories</option>
          <option value="Hantee">Hantee</option>
          <option value="Abandonnee">Abandonnee</option>
          <option value="Maudite">Maudite</option>
          <option value="Mysterieuse">Mysterieuse</option>
        </select>
      </div>
      <div class="col-md-3">
        <input
          id="priceFilter"
          type="number"
          min="0"
          class="form-control bg-black text-light border-danger"
          placeholder="Prix max (EUR)"
        >
      </div>
    </div>
  </section>

  <section class="container mb-5">
    <div id="listings" class="row g-4"></div>
  </section>

  <script src="./js/api.js"></script>
  <script src="./js/listings.js"></script>
  <script>
    loadListings();
  </script>
</body>
</html>
