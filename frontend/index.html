<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Maison Épouvante 👻</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- CSS optionnel -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="bg-dark text-light">

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-black shadow">
  <div class="container">
    <a class="navbar-brand fw-bold text-danger" href="#">
      🏚️ Maison Épouvante
    </a>

    <div class="ms-auto d-flex gap-2" id="nav-actions">
      <!-- rempli en JS -->
    </div>
  </div>
</nav>

<!-- ================= HERO ================= -->
<header class="py-5 text-center bg-black border-bottom border-danger">
  <div class="container">
    <h1 class="display-5 fw-bold text-danger">
      Osez passer la nuit…
    </h1>
    <p class="lead">
      Maisons hantées • Manoirs abandonnés • Lieux maudits
    </p>
  </div>
</header>

<!-- ================= FILTRES ================= -->
<section class="container my-4">
  <div class="row g-3">
    <div class="col-md-4">
      <input id="search" class="form-control bg-secondary text-light"
             placeholder="🔍 Rechercher une maison...">
    </div>
    <div class="col-md-4">
      <select id="categoryFilter" class="form-select bg-secondary text-light">
        <option value="">Toutes catégories</option>
        <option>Hantée</option>
        <option>Abandonnée</option>
        <option>Maudite</option>
        <option>Mystérieuse</option>
      </select>
    </div>
    <div class="col-md-4">
      <input id="priceFilter" type="number"
             class="form-control bg-secondary text-light"
             placeholder="Prix max (€)">
    </div>
  </div>
</section>

<!-- ================= ANNONCES ================= -->
<section class="container my-5">
  <h2 class="mb-4 text-center">Annonces disponibles</h2>
  <div id="listings" class="row g-4">
    <!-- Injecté par listings.js -->
  </div>
</section>

<!-- ================= FOOTER ================= -->
<footer class="bg-black py-4 mt-5">
  <div class="container text-center">
    <p class="mb-1">📧 contact@maison-epouvante.fr</p>
    <p class="text-muted mb-0">
      © 2026 Maison Épouvante — Projet pédagogique
    </p>
  </div>
</footer>

<!-- ================= SCRIPTS ================= -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/listings.js"></script>

<script>
  // GESTION NAVBAR SELON AUTH
  const nav = document.getElementById("nav-actions");
  const token = localStorage.getItem("token");

  if (token) {
    nav.innerHTML = `
      <a href="create-listing.html" class="btn btn-danger">
        Ajouter une annonce
      </a>
      <button class="btn btn-outline-light" onclick="logout()">
        Déconnexion
      </button>
    `;
  } else {
    nav.innerHTML = `
      <a href="login.html" class="btn btn-outline-light">
        Connexion
      </a>
      <a href="login.html" class="btn btn-danger">
        S’inscrire
      </a>
    `;
  }

  // Chargement des annonces
  loadListings();
</script>

</body>
</html>
