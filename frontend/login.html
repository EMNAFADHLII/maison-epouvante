<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Maison Épouvante – Connexion / Inscription</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- CSS perso -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-dark text-light">

  <!-- NAVBAR -->
  <nav class="navbar navbar-dark bg-black shadow">
    <div class="container">
      <a class="navbar-brand fw-bold text-danger" href="index.html">
        🏚️ Maison Épouvante
      </a>
    </div>
  </nav>

  <!-- CONTAINER -->
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <!-- CARD -->
        <div class="card bg-secondary text-light shadow-lg">
          <div class="card-body">

            <!-- TABS -->
            <ul class="nav nav-tabs mb-4" id="authTabs">
              <li class="nav-item">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#login">
                  Connexion
                </button>
              </li>
              <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#register">
                  Inscription
                </button>
              </li>
            </ul>

            <div class="tab-content">

              <!-- LOGIN -->
              <div class="tab-pane fade show active" id="login">
                <h4 class="mb-3">Connexion</h4>

                <form id="loginForm">
                  <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" required />
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" class="form-control" required />
                  </div>

                  <button class="btn btn-danger w-100">
                    Se connecter
                  </button>
                </form>
              </div>

              <!-- REGISTER -->
              <div class="tab-pane fade" id="register">
                <h4 class="mb-3">Inscription</h4>

                <form id="registerForm">
                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label class="form-label">Nom</label>
                      <input type="text" class="form-control" required />
                    </div>

                    <div class="col-md-6 mb-3">
                      <label class="form-label">Prénom</label>
                      <input type="text" class="form-control" required />
                    </div>
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" required />
                  </div>

                  <div class="mb-3">
                    <label class="form-label">
                      Mot de passe
                      <small class="text-warning">(min 8 caractères)</small>
                    </label>
                    <input
                      type="password"
                      class="form-control"
                      minlength="8"
                      required
                    />
                  </div>

                  <button class="btn btn-dark w-100">
                    S’inscrire
                  </button>
                </form>
              </div>

            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
